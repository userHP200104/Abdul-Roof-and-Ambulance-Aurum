<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner Balance: Yoga Quest</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            width: 800px;
            height: 600px;
            background: linear-gradient(to bottom, #d48a4d, #8f9b4c);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 4px solid #333;
            overflow: hidden;
        }
        /* CRT Scanline Effect */
        #game-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        #ui {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            z-index: 3;
            text-shadow: 2px 2px 0 #000;
        }
        #score-board { font-size: 20px; color: #ffeb3b; }
        .meter-container { margin-bottom: 10px; font-size: 12px; }
        progress {
            width: 150px; height: 15px;
            appearance: none; -webkit-appearance: none;
            border: 2px solid #fff;
        }
        progress::-webkit-progress-bar { background-color: #222; }
        #balance-meter::-webkit-progress-value { background-color: #4caf50; }
        #intensity-meter::-webkit-progress-value { background-color: #f44336; }
        
        #player {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px; height: 100px;
            background-color: #ff5722;
            border: 4px solid #fff;
            border-radius: 30px 30px 10px 10px;
            z-index: 1;
            transition: transform 0.1s;
        }
        #game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
        }
        button {
            margin-top: 20px; padding: 15px 30px;
            font-family: 'Press Start 2P', monospace;
            background: #ff5722; color: #fff;
            border: 4px solid #fff; cursor: pointer;
        }
        button:hover { background: #e64a19; }
        #instructions {
            position: absolute; bottom: 10px; width: 100%;
            text-align: center; font-size: 10px; z-index: 3; text-shadow: 1px 1px 0 #000;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div id="score-board">SCORE: <span id="score">0</span></div>
        <div id="meters">
            <div class="meter-container">
                BALANCE (Keep Centered)<br>
                <progress id="balance-meter" value="50" max="100"></progress>
            </div>
            <div class="meter-container">
                INTENSITY<br>
                <progress id="intensity-meter" value="0" max="100"></progress>
            </div>
        </div>
    </div>
    
    <div id="player"></div>
    <div id="instructions">Use LEFT and RIGHT arrows to maintain balance!</div>

    <div id="game-over">
        <h2>NAMASKARAM.<br><br>FOCUS LOST.</h2>
        <p>Final Score: <span id="final-score">0</span></p>
        <button onclick="resetGame()">RESTART SADHANA</button>
    </div>
</div>

<script>
    let score = 0;
    let balance = 50; // 0 to 100, 50 is perfect
    let intensity = 1;
    let gameLoop;
    let isGameOver = false;
    let driftDirection = 1;

    const scoreEl = document.getElementById('score');
    const balanceMeter = document.getElementById('balance-meter');
    const intensityMeter = document.getElementById('intensity-meter');
    const playerEl = document.getElementById('player');
    const gameOverScreen = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');

    // Controls
    let keys = { ArrowLeft: false, ArrowRight: false };

    document.addEventListener('keydown', (e) => {
        if(keys.hasOwnProperty(e.code)) keys[e.code] = true;
    });
    document.addEventListener('keyup', (e) => {
        if(keys.hasOwnProperty(e.code)) keys[e.code] = false;
    });

    function update() {
        if(isGameOver) return;

        // Increase score and intensity over time
        score += Math.floor(intensity);
        scoreEl.innerText = score;
        
        intensity += 0.01; 
        intensityMeter.value = intensity;

        // Apply random drift based on intensity
        if (Math.random() < 0.05) {
            driftDirection = Math.random() > 0.5 ? 1 : -1;
        }
        
        // The higher the intensity, the harder the drift pulls
        balance += (driftDirection * (intensity * 0.15));

        // Player input counteracts drift
        if (keys.ArrowLeft) balance -= 1.5;
        if (keys.ArrowRight) balance += 1.5;

        // Update UI
        balanceMeter.value = balance;
        
        // Visual feedback on the "yogi" (player block tilts)
        let tilt = (balance - 50) * 1.5; 
        playerEl.style.transform = `translateX(-50%) rotate(${tilt}deg)`;

        // Check fail state (balance hits 0 or 100)
        if (balance <= 0 || balance >= 100) {
            endGame();
        } else {
            gameLoop = requestAnimationFrame(update);
        }
    }

    function endGame() {
        isGameOver = true;
        cancelAnimationFrame(gameLoop);
        finalScoreEl.innerText = score;
        gameOverScreen.style.display = 'flex';
    }

    function resetGame() {
        score = 0;
        balance = 50;
        intensity = 1;
        isGameOver = false;
        gameOverScreen.style.display = 'none';
        playerEl.style.transform = `translateX(-50%) rotate(0deg)`;
        gameLoop = requestAnimationFrame(update);
    }

    // Start Game
    resetGame();
</script>

</body>
</html>
