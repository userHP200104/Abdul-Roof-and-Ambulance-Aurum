<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ambulance Aurum & Abdul Roof</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: 'Press Start 2P', monospace;
            touch-action: none; 
            user-select: none;
            color: #fff;
            -webkit-tap-highlight-color: transparent; 
        }
        
        #gameCanvas {
            display: block; width: 100%; height: 100%;
            position: absolute; top: 0; left: 0; z-index: 1;
            image-rendering: pixelated; 
        }

        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none; 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 99;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.7); z-index: 100; text-align: center;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        
        h1 {
            font-size: 28px; text-shadow: 4px 4px 0px #c0392b, -2px -2px 0px #3498db; line-height: 1.5; margin-bottom: 10px;
            padding: 0 20px; animation: pulseTitle 2s infinite;
        }

        @keyframes pulseTitle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        .btn {
            background: #f1c40f; color: #000; border: 4px solid #fff;
            padding: 15px 30px; font-size: 18px; font-family: inherit;
            cursor: pointer; text-transform: uppercase; margin-top: 20px;
            box-shadow: 6px 6px 0px #d35400;
            pointer-events: auto;
            position: relative;
            z-index: 101;
            transition: all 0.1s;
        }
        .btn:active { box-shadow: 0px 0px 0px #d35400; transform: translate(6px, 6px); }

        .stats { margin-top: 20px; font-size: 14px; color: #3498db; text-shadow: 2px 2px 0px #000; }
        .controls-hint { margin-top: 40px; font-size: 10px; color: #ecf0f1; line-height: 2; max-width: 80%; background: rgba(0,0,0,0.5); padding: 10px; border: 2px dashed #fff; }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; padding: 15px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 90; text-shadow: 2px 2px 0px #000;
        }
        
        .hud-left { display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .hud-right { text-align: right; font-size: 12px; color: #f1c40f; pointer-events: none; }
        #scoreDisplay { font-size: 24px; color: #f1c40f; text-shadow: 3px 3px 0px #d35400; }
        #distDisplay { font-size: 12px; color: #fff; }
        #stageDisplay { font-size: 14px; margin-top: 5px; color: #e74c3c; animation: blink 1s infinite; text-shadow: 2px 2px 0px #c0392b;}
        #powerupDisplay { font-size: 14px; color: #9b59b6; margin-top: 5px; text-shadow: 2px 2px 0px #8e44ad; }
        #bossHpDisplay { font-size: 16px; margin-top: 10px; color: #e74c3c; background: rgba(0,0,0,0.5); padding: 5px; border: 2px solid #e74c3c; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .hidden { display: none !important; }
        
        #orientationWarning {
            display: none; background: #000; z-index: 999;
        }
        @media screen and (orientation: portrait) {
            #orientationWarning { display: flex; }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div class="crt-overlay"></div>

    <div id="hud" class="hidden">
        <div class="hud-left">
            <div id="scoreDisplay">000000</div>
            <div id="distDisplay">0m</div>
            <div id="powerupDisplay"></div>
        </div>
        <div class="hud-right">
            <div id="stageDisplay">STAGE 1: CITY</div>
            <div id="bossHpDisplay" class="hidden">BOSS HP: 3</div>
        </div>
    </div>

    <div id="startScreen" class="overlay">
        <h1>AMBULANCE AURUM<br>& ABDUL ROOF</h1>
        <div class="stats">HIGH SCORE: <span id="hiScoreMenu">0</span></div>
        <button class="btn" id="startBtnEl">START ENGINE</button>
        <div class="controls-hint">
            TAP LEFT HALF: Jump & Double Jump<br>
            TAP BOTTOM RIGHT: Shoot Straight<br>
            TAP TOP RIGHT: Shoot 45&deg; Up
        </div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1 style="color: #e74c3c; text-shadow: 4px 4px 0px #c0392b;">WRECKED!</h1>
        <div class="stats" style="color: #fff; font-size: 20px;">SCORE: <span id="finalScore">0</span></div>
        <div class="stats">HIGH SCORE: <span id="hiScoreEnd">0</span></div>
        <button class="btn" id="restartBtnEl">TRY AGAIN</button>
    </div>

    <div id="orientationWarning" class="overlay">
        <h2 style="color: #f1c40f; text-align:center; padding: 20px; line-height: 1.5; text-shadow: 2px 2px 0 #000;">PLEASE ROTATE<br>YOUR PHONE<br>TO LANDSCAPE</h2>
    </div>

<script>
/** * AUDIO ENGINE */
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
let sirenInterval = null;
let sirenToggle = false;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, type, duration, vol=0.1) {
    if(!audioCtx || audioCtx.state === 'suspended') return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function sfxJump() { playTone(300, 'square', 0.15, 0.05); setTimeout(()=>playTone(500, 'square', 0.15, 0.05), 80); }
function sfxShoot() { playTone(800, 'sawtooth', 0.1, 0.05); }
function sfxNail() { playTone(1400, 'square', 0.05, 0.05); }
function sfxExplosion() { playTone(100, 'sawtooth', 0.5, 0.2); setTimeout(()=>playTone(50, 'square', 0.4, 0.2), 50); }
function sfxPowerup() { playTone(800, 'sine', 0.1, 0.1); setTimeout(()=>playTone(1200, 'sine', 0.2, 0.1), 100); }
function sfxBossHit() { playTone(200, 'square', 0.2, 0.1); }

function startSiren() {
    if(sirenInterval) clearInterval(sirenInterval);
    sirenInterval = setInterval(() => {
        if(gameState !== 'PLAYING' && gameState !== 'BOSS') return;
        sirenToggle = !sirenToggle;
        playTone(sirenToggle ? 650 : 850, 'sine', 0.4, 0.02);
    }, 400);
}
function stopSiren() { clearInterval(sirenInterval); sirenInterval = null; }

/** * GAME ENGINE & RESIZE */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let W, H, GROUND_Y, dpr;
function resize() {
    W = window.innerWidth; H = window.innerHeight;
    GROUND_Y = H * 0.82; 
    dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.scale(dpr, dpr);
    ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));
resize();

// UI Elements
const ui = {
    start: document.getElementById('startScreen'), over: document.getElementById('gameOverScreen'),
    hud: document.getElementById('hud'), score: document.getElementById('scoreDisplay'),
    dist: document.getElementById('distDisplay'), stage: document.getElementById('stageDisplay'),
    bossHp: document.getElementById('bossHpDisplay'), power: document.getElementById('powerupDisplay'),
    hiMenu: document.getElementById('hiScoreMenu'), hiEnd: document.getElementById('hiScoreEnd'),
    startBtn: document.getElementById('startBtnEl'), restartBtn: document.getElementById('restartBtnEl')
};

let highScore = localStorage.getItem('ambulanceHighScore') || 0;
ui.hiMenu.innerText = highScore;

// Game State
let gameState = 'MENU';
let score = 0, distance = 0, frameCount = 0, currentStage = 0;
let globalSpeed = 6, screenShake = 0, bossTargetPoints = 1000; 
let renderLoopStarted = false;

// Stage themes corresponding to the sprite sheets
const stages = [
    { name: "STAGE 1: CITY", bg: "#1a1a2e", sky: "#0f3460", mid: "#16213e", ground: "#222", line: "#f1c40f" },
    { name: "STAGE 2: DESERT", bg: "#d35400", sky: "#e67e22", mid: "#a04000", ground: "#c2b280", line: "#f39c12" },
    { name: "STAGE 3: TUNDRA", bg: "#1e3799", sky: "#4a69bd", mid: "#0c2461", ground: "#ecf0f1", line: "#82ccdd" },
    { name: "STAGE 4: CYBER", bg: "#2c003e", sky: "#510a32", mid: "#190028", ground: "#000", line: "#ff007f" },
    { name: "STAGE 5: VOLCANO", bg: "#2d0000", sky: "#4a0000", mid: "#1a0000", ground: "#111", line: "#c0392b" }
];

let player, entities = [], particles = [], projectiles = [], floatingTexts = [], boss = null;

/** * GRAPHICS UTILS */
function drawRect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h)); }
function drawGlow(x, y, radius, color) {
    let grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
    grad.addColorStop(0, color); grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2); ctx.fill();
}

/** * CLASSES */
class Player {
    constructor() {
        this.w = 110; this.h = 55;
        this.x = 80; this.y = GROUND_Y - this.h;
        this.dy = 0; this.gravity = 0.65; this.jumpPower = -12.5;
        this.jumps = 0; this.maxJumps = 1; this.lightTimer = 0;
        this.wheelAngle = 0; this.recoil = 0;
        
        this.p_multi = 0; this.p_invinc = 0; this.p_spread = 0; this.p_ice = 0;
        this.multiplier = 1;
    }
    jump() {
        if (this.jumps < this.maxJumps) {
            this.dy = this.jumpPower; this.jumps++; sfxJump();
            spawnParticles(this.x + 30, GROUND_Y, "#fff", 8);
        }
    }
    shoot(angleUp = false) {
        let type = gameState === 'BOSS' ? 'nail' : (this.p_ice > 0 ? 'ice' : 'water');
        let yOffset = gameState === 'BOSS' ? -25 : -20;
        let vy = angleUp ? -6 : 0, vx = 14;
        
        projectiles.push(new Projectile(this.x + 70, this.y + yOffset, vx, vy, type));
        if (this.p_spread > 0) {
            projectiles.push(new Projectile(this.x + 70, this.y + yOffset - 8, vx, vy - 3, type));
            projectiles.push(new Projectile(this.x + 70, this.y + yOffset + 8, vx, vy + 3, type));
        }
        this.recoil = 8;
        if(gameState === 'BOSS') sfxNail(); else sfxShoot();
    }
    update() {
        this.dy += this.gravity; this.y += this.dy;
        if (this.y + this.h >= GROUND_Y) { this.y = GROUND_Y - this.h; this.dy = 0; this.jumps = 0; }

        this.wheelAngle += (globalSpeed * 0.1);
        this.lightTimer++;
        if (this.recoil > 0) this.recoil--;

        if (frameCount % 4 === 0 && this.y + this.h >= GROUND_Y) {
            particles.push(new Particle(this.x - 5, this.y + this.h - 5, "#7f8c8d", "smoke"));
        }

        if (this.p_invinc > 0) this.p_invinc--;
        if (this.p_spread > 0) this.p_spread--;
        if (this.p_ice > 0) this.p_ice--;
        if (this.p_multi > 0) { this.p_multi--; this.multiplier = 2; } else { this.multiplier = 1; this.maxJumps = 1; }
    }
    draw() {
        if (this.p_invinc > 0 && frameCount % 4 < 2) return;
        
        let bx = this.x, by = this.y;
        
        // --- AMBULANCE AURUM (Accurate to Sprite) ---
        // Main Box
        drawRect(bx, by, 85, this.h - 12, "#ecf0f1"); // White body
        drawRect(bx, by, 85, 2, "#bdc3c7"); // Top shading
        
        // Front Cab / Hood
        ctx.fillStyle = "#ecf0f1";
        ctx.beginPath(); 
        ctx.moveTo(bx + 85, by + 12); 
        ctx.lineTo(bx + 105, by + 26); 
        ctx.lineTo(bx + 110, by + 30); 
        ctx.lineTo(bx + 110, by + this.h - 12); 
        ctx.lineTo(bx + 85, by + this.h - 12); 
        ctx.fill();
        
        // Grill & Bumper
        drawRect(bx + 106, by + 32, 5, 10, "#7f8c8d"); // Grill
        drawRect(bx - 2, by + this.h - 14, 114, 8, "#7f8c8d"); // Gray Bumper
        drawRect(bx - 2, by + this.h - 14, 114, 2, "#95a5a6"); // Bumper highlight
        
        // The Orange Stripe
        drawRect(bx, by + 22, 110, 8, "#e67e22"); 
        
        // Blue Star of Life
        drawRect(bx + 18, by + 10, 8, 20, "#2980b9"); // Vertical
        drawRect(bx + 12, by + 16, 20, 8, "#2980b9"); // Horizontal
        drawRect(bx + 14, by + 12, 16, 16, "#2980b9"); // Diagonals block
        drawRect(bx + 20, by + 12, 4, 16, "#ecf0f1"); // Inner snake/staff mock
        
        // Windows
        drawRect(bx + 62, by + 6, 20, 14, "#2c3e50"); // Side window
        ctx.beginPath(); ctx.moveTo(bx + 85, by + 6); ctx.lineTo(bx + 100, by + 18); ctx.lineTo(bx + 85, by + 18); ctx.fillStyle = "#2c3e50"; ctx.fill(); // Windshield
        drawRect(bx + 66, by + 6, 4, 14, "rgba(255,255,255,0.2)"); // Reflection
        
        // Headlight 
        if (gameState !== 'GAMEOVER') {
            ctx.fillStyle = "rgba(241, 196, 15, 0.2)";
            ctx.beginPath(); ctx.moveTo(bx + 110, by + 32); ctx.lineTo(bx + 350, by - 30); ctx.lineTo(bx + 350, by + 80); ctx.fill();
            drawRect(bx + 108, by + 30, 3, 6, "#f1c40f"); 
        }

        // Siren Lights
        let sirenRed = Math.floor(this.lightTimer / 8) % 2 === 0;
        drawRect(bx + 60, by - 8, 12, 8, "#111"); // Base
        drawRect(bx + 62, by - 6, 8, 6, sirenRed ? "#e74c3c" : "#bdc3c7");
        drawRect(bx + 75, by - 8, 12, 8, "#111"); // Base
        drawRect(bx + 77, by - 6, 8, 6, !sirenRed ? "#3498db" : "#bdc3c7");
        
        if(sirenRed) drawGlow(bx + 66, by - 3, 30, "rgba(231, 76, 60, 0.5)");
        else drawGlow(bx + 81, by - 3, 30, "rgba(52, 152, 219, 0.5)");

        // --- ABDUL ROOF (Dynamic Outfits) ---
        let ax = bx + 35, ay = by - 20;
        let skin = "#a66a38";
        
        // Offset for recoil
        let armX = ax + 10 - this.recoil;

        // Stage 5: Hazmat Suit
        if (currentStage % 5 === 4) {
            drawRect(ax, ay-12, 18, 32, "#f1c40f"); // Yellow Suit
            drawRect(ax-2, ay, 8, 15, "#f1c40f"); // Back tank
            drawRect(ax+4, ay-8, 12, 10, "#111"); // Mask base
            drawRect(ax+12, ay-6, 4, 4, "#555"); // Goggle
            drawRect(ax+10, ay-2, 6, 6, "#333"); // Filter
            
            // Nail Gun (Yellow/Gray)
            drawRect(armX, ay + 6, 12, 6, "#f1c40f"); // Arm
            drawRect(armX + 12, ay + 4, 14, 8, "#f1c40f"); // Gun Body
            drawRect(armX + 26, ay + 6, 10, 4, "#bdc3c7"); // Barrel
            drawRect(armX + 16, ay + 12, 4, 8, "#333"); // Mag
        } 
        // Stage 3: Tundra Parka
        else if (currentStage % 5 === 2) {
            drawRect(ax-2, ay-14, 22, 16, "#bdc3c7"); // Fur hood
            drawRect(ax, ay, 20, 20, "#34495e"); // Heavy Parka
            drawRect(ax+4, ay-10, 10, 12, skin); // Face
            drawRect(ax+6, ay-8, 6, 3, "#111"); // Mustache/Hair
            
            this.drawStandardWeapon(armX, ay);
        }
        // Stages 1, 2, 4
        else {
            drawRect(ax, ay, 18, 20, "#2ecc71"); // High-Vis Vest
            drawRect(ax, ay, 18, 4, "#2980b9"); // Blue shirt under
            drawRect(ax+4, ay-12, 12, 12, skin); // Face
            drawRect(ax+4, ay-14, 12, 4, "#111"); // Hair
            drawRect(ax+8, ay-6, 8, 2, "#111"); // Mustache

            if (currentStage % 5 === 1) { // Desert: Aviators & Scarf
                drawRect(ax+8, ay-10, 8, 4, "#111"); // Shades
                // Scarf
                drawRect(ax-8, ay-2, 12, 4, "#d35400");
                if(frameCount % 10 < 5) drawRect(ax-14, ay, 8, 4, "#d35400");
                else drawRect(ax-14, ay-4, 8, 4, "#d35400");
            }
            if (currentStage % 5 === 3) { // Cyber: Eyepatch
                drawRect(ax+8, ay-10, 4, 4, "#000"); // Patch
                drawRect(ax+4, ay-9, 4, 2, "#000"); // Strap
            }
            
            this.drawStandardWeapon(armX, ay);
        }

        // --- WHEELS ---
        this.drawWheel(bx + 20, by + this.h - 10);
        this.drawWheel(bx + 85, by + this.h - 10);
    }
    
    drawStandardWeapon(armX, ay) {
        if (gameState === 'BOSS') {
            // Nail Gun (Yellow & Gray)
            drawRect(armX, ay + 6, 12, 6, "#2980b9"); // Sleeve
            drawRect(armX + 12, ay + 4, 14, 8, "#f1c40f"); // Gun Body
            drawRect(armX + 26, ay + 6, 10, 4, "#bdc3c7"); // Barrel
            drawRect(armX + 16, ay + 12, 4, 8, "#333"); // Mag
        } else {
            // Water Cannon (Gray)
            drawRect(armX, ay + 6, 12, 6, "#2980b9"); // Sleeve
            drawRect(armX + 12, ay + 4, 18, 8, "#95a5a6"); // Cannon Body
            drawRect(armX + 30, ay + 5, 6, 6, "#7f8c8d"); // Nozzle
        }
    }

    drawWheel(wx, wy) {
        ctx.save(); ctx.translate(wx, wy); ctx.rotate(this.wheelAngle);
        ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI*2); ctx.fillStyle = "#111"; ctx.fill(); // Tire
        ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI*2); ctx.fillStyle = "#bdc3c7"; ctx.fill(); // Rim
        ctx.fillStyle = "#7f8c8d"; ctx.fillRect(-7, -1, 14, 2); ctx.fillRect(-1, -7, 2, 14); // Spokes
        ctx.restore();
    }
}

class Obstacle {
    constructor(type) {
        this.x = W; this.type = type; this.passed = false;
        this.anim = Math.random() * 100;
        
        if (type === 'air') {
            this.y = GROUND_Y - 80 - Math.random() * 60;
            this.w = 30; this.h = 30;
        } else if (type === 'powerup') {
            this.y = GROUND_Y - 60 - Math.random() * 70;
            this.w = 26; this.h = 26;
            const pTypes = ['spread', 'ice', 'jump', 'star', 'multi'];
            this.powerType = pTypes[Math.floor(Math.random() * pTypes.length)];
            this.color = "#9b59b6";
        } else {
            this.w = 40; this.h = 40;
            this.y = GROUND_Y - this.h;
        }
    }
    update() {
        this.x -= globalSpeed;
        this.anim += 0.2;
        if (!this.passed && this.x + this.w < player.x && this.type === 'ground') { this.passed = true; addScore(20); }
    }
    draw() {
        let x = this.x, y = this.y;
        let stg = currentStage % 5;
        
        if(this.type === 'powerup') {
            y += Math.sin(this.anim) * 5;
            drawRect(x, y, this.w, this.h, this.color);
            drawRect(x+4, y+4, this.w-8, this.h-8, "#8e44ad");
            drawRect(x+10, y+10, 6, 6, "#fff"); 
            drawGlow(x+this.w/2, y+this.h/2, 30, "rgba(155, 89, 182, 0.4)");
        } 
        else if (this.type === 'air') {
            let cx = x + this.w/2, cy = y + this.h/2;
            if (stg === 0) { // Orange Flame
                drawGlow(cx, cy, 30, "rgba(230, 126, 34, 0.6)");
                drawRect(x+5, y+5+Math.sin(this.anim)*3, 20, 20, "#e67e22");
                drawRect(x+10, y+10+Math.sin(this.anim)*3, 10, 10, "#f1c40f");
            } else if (stg === 1) { // Solar Flare
                drawGlow(cx, cy, 35, "rgba(241, 196, 15, 0.6)");
                ctx.beginPath(); ctx.arc(cx, cy, 12 + Math.sin(this.anim*2)*2, 0, Math.PI*2); ctx.fillStyle="#f1c40f"; ctx.fill();
                ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.fillStyle="#fff"; ctx.fill();
            } else if (stg === 2) { // Frost Fire
                drawGlow(cx, cy, 30, "rgba(52, 152, 219, 0.6)");
                ctx.save(); ctx.translate(cx, cy); ctx.rotate(this.anim);
                drawRect(-12, -4, 24, 8, "#3498db"); drawRect(-4, -12, 8, 24, "#7ed6df");
                ctx.restore();
            } else if (stg === 3) { // Pink Plasma
                drawGlow(cx, cy, 35, "rgba(255, 0, 127, 0.6)");
                ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI*2); ctx.fillStyle="#ff007f"; ctx.fill();
                ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI*2); ctx.fillStyle="#ffb8e0"; ctx.fill();
            } else { // Magma Boulder
                drawGlow(cx, cy, 30, "rgba(192, 57, 43, 0.6)");
                ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI*2); ctx.fillStyle="#8e44ad"; ctx.fill(); // dark base
                drawRect(x+6, y+8, 18, 14, "#c0392b");
                drawRect(x+12, y+12, 6, 6, "#f1c40f");
            }
        } 
        else { // Ground Hazards
            if (stg === 0) { // Concrete Barrier
                drawRect(x, y, this.w, this.h, "#95a5a6");
                drawRect(x, y, this.w, 5, "#bdc3c7");
                // Orange diagonal stripes (approximated)
                drawRect(x+5, y+10, 10, 20, "#e67e22");
                drawRect(x+25, y+10, 10, 20, "#e67e22");
            } else if (stg === 1) { // Tumbleweed
                ctx.save(); ctx.translate(x+this.w/2, y+this.h/2); ctx.rotate(this.anim);
                ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.fillStyle="#a0522d"; ctx.fill();
                drawRect(-15, -2, 30, 4, "#cd853f"); drawRect(-2, -15, 4, 30, "#cd853f");
                drawRect(-10, -10, 20, 20, "#8b4513");
                ctx.restore();
            } else if (stg === 2) { // Ice Block
                drawRect(x, y, this.w, this.h, "#7ed6df");
                drawRect(x+4, y+4, this.w-8, this.h-8, "#3498db");
                // Spikes
                ctx.fillStyle = "#fff";
                ctx.beginPath(); ctx.moveTo(x+5, y); ctx.lineTo(x+10, y-10); ctx.lineTo(x+15, y); ctx.fill();
                ctx.beginPath(); ctx.moveTo(x+25, y); ctx.lineTo(x+30, y-12); ctx.lineTo(x+35, y); ctx.fill();
            } else if (stg === 3) { // Neon Barrier
                drawRect(x, y, 6, this.h, "#2c3e50"); drawRect(x+this.w-6, y, 6, this.h, "#2c3e50");
                drawRect(x, y+10, this.w, 6, "#ff007f"); drawGlow(x+this.w/2, y+13, 15, "rgba(255,0,127,0.5)");
                drawRect(x, y+25, this.w, 6, "#00ffcc"); drawGlow(x+this.w/2, y+28, 15, "rgba(0,255,204,0.5)");
            } else { // Obsidian
                ctx.fillStyle = "#111";
                ctx.beginPath(); ctx.moveTo(x, y+this.h); ctx.lineTo(x+15, y); ctx.lineTo(x+25, y+10); ctx.lineTo(x+this.w, y+this.h); ctx.fill();
                ctx.fillStyle = "#333";
                ctx.beginPath(); ctx.moveTo(x+15, y); ctx.lineTo(x+20, y+20); ctx.lineTo(x+10, y+this.h); ctx.fill();
            }
        }
    }
}

class Boss {
    constructor() {
        this.w = 90; this.h = 120; this.x = W + 100;
        this.y = GROUND_Y - this.h - 20;
        this.hp = 3 + (currentStage * 2); this.maxHp = this.hp;
        this.state = 'entering'; this.throwTimer = 0; this.hurtFlash = 0;
    }
    update() {
        if (this.state === 'entering') {
            this.x -= 3; if (this.x <= W - 140) this.state = 'active';
        } else if (this.state === 'active') {
            this.y = GROUND_Y - this.h - 30 + Math.sin(frameCount * 0.08) * 15;
            this.throwTimer++;
            let attackRate = Math.max(35, 90 - (currentStage * 10));
            if (this.throwTimer > attackRate) { this.throwTimer = 0; this.throwTank(); }
        }
    }
    throwTank() {
        let r = Math.random(), type = 'fastball';
        if (currentStage >= 1 && r > 0.4) type = 'bouncer';
        if (currentStage >= 2 && r > 0.7) type = 'raindrop';
        if (currentStage >= 4 && r > 0.9) {
            entities.push(new GasTank('fastball', this.x, this.y + 40));
            setTimeout(() => entities.push(new GasTank('bouncer', this.x, this.y + 40)), 200);
            return;
        }
        entities.push(new GasTank(type, this.x, this.y + 40));
    }
    draw() {
        let bx = this.x, by = this.y;
        
        // --- Hover Platform (Since he's human, he needs to fly) ---
        drawRect(bx - 10, by + 105, 110, 15, "#34495e");
        drawRect(bx - 10, by + 110, 110, 5, "#f1c40f"); 
        let flameH = 15 + Math.random() * 15;
        drawRect(bx + 10, by + 120, 15, flameH, "#e67e22");
        drawRect(bx + 65, by + 120, 15, flameH, "#e67e22");

        // --- GASTANK MOHAMMED (Accurate to Concept) ---
        
        // Background Arm (Holding Tank)
        drawRect(bx + 55, by + 40, 15, 20, "#95a5a6"); // Gray sleeve
        drawRect(bx + 60, by + 60, 12, 10, "#8b4513"); // Brown Glove
        
        // Tank Backpack / Held Tank
        drawRect(bx + 60, by + 30, 35, 50, "#c0392b"); // Red tank
        drawRect(bx + 70, by + 25, 15, 5, "#7f8c8d"); // Cap

        // Legs
        drawRect(bx + 25, by + 75, 18, 30, "#2c3e50"); // Blue Jeans L
        drawRect(bx + 45, by + 75, 18, 30, "#2c3e50"); // Blue Jeans R
        drawRect(bx + 22, by + 100, 20, 10, "#111"); // Boot L
        drawRect(bx + 45, by + 100, 20, 10, "#111"); // Boot R

        // Torso & Apron
        drawRect(bx + 20, by + 35, 40, 45, "#8b4513"); // Brown Leather Apron
        drawRect(bx + 25, by + 35, 30, 15, "#95a5a6"); // Gray shirt showing top

        // Head & Welding Mask
        drawRect(bx + 25, by + 5, 30, 32, "#34495e"); // Dark mask base
        drawRect(bx + 25, by + 5, 10, 32, "#2c3e50"); // Mask shading
        drawRect(bx + 35, by + 12, 18, 12, "#111"); // Black Visor

        // Throwing Arm Logic
        let attackRate = Math.max(35, 90 - (currentStage * 10));
        let throwPhase = this.throwTimer / attackRate;
        
        if (throwPhase > 0.8) {
            // Winding up to throw
            drawRect(bx + 10, by + 35, 25, 15, "#95a5a6"); // Sleeve up
            drawRect(bx - 5, by + 40, 15, 12, "#8b4513"); // Glove pulled back
        } else {
            // Resting / Idle
            drawRect(bx + 15, by + 40, 15, 25, "#95a5a6"); // Sleeve down
            drawRect(bx + 15, by + 60, 15, 15, "#8b4513"); // Glove resting
        }

        if (this.hurtFlash > 0) {
            drawRect(bx - 10, by, this.w + 20, this.h + 20, "rgba(255, 255, 255, 0.8)");
            this.hurtFlash--;
        }
    }
}

class GasTank {
    constructor(type, x, y) {
        this.x = x; this.y = y; this.w = 36; this.h = 18; this.type = type;
        this.rot = 0;
        if (type === 'fastball') { this.dx = -10 - currentStage; this.dy = 0; this.g = 0; }
        else if (type === 'bouncer') { this.dx = -7 - currentStage; this.dy = -3; this.g = 0.5; }
        else if (type === 'raindrop') { this.dx = -4; this.dy = -16; this.g = 0.35; }
        this.isIce = currentStage >= 2;
    }
    update() {
        this.x += this.dx; this.dy += this.g; this.y += this.dy;
        this.rot -= 0.1;
        if (this.y + this.h >= GROUND_Y && this.type === 'bouncer') {
            this.y = GROUND_Y - this.h; this.dy = -10;
        }
    }
    draw() {
        ctx.save(); ctx.translate(this.x + this.w/2, this.y + this.h/2); 
        if(this.type === 'raindrop') ctx.rotate(this.rot);
        
        let c = this.isIce ? "#7ed6df" : "#c0392b"; // Red body
        drawRect(-this.w/2, -this.h/2, this.w, this.h, c);
        drawRect(-this.w/2 + 5, -this.h/2, 5, this.h, "rgba(255,255,255,0.4)"); // White shine
        drawRect(-this.w/2 - 6, -this.h/2 + 3, 6, 12, "#7f8c8d"); // Gray Nozzle
        drawRect(-this.w/2 + 15, -this.h/2 + 4, 12, 10, "#f1c40f"); // Warning label
        
        ctx.restore();
    }
}

class Projectile {
    constructor(x, y, dx, dy, type) {
        this.x = x; this.y = y; this.dx = dx; this.dy = dy; this.type = type;
        this.w = type === 'nail' ? 14 : 24; this.h = type === 'nail' ? 4 : 8; this.active = true;
    }
    update() { this.x += this.dx; this.y += this.dy; if(this.x > W || this.y < 0) this.active = false; }
    draw() {
        if(this.type === 'nail') {
            drawRect(this.x, this.y, this.w, this.h, "#bdc3c7"); // Silver nail
            drawRect(this.x + this.w - 4, this.y - 2, 4, 8, "#7f8c8d"); // Nail head
        } else {
            let c = this.type === 'water' ? "#3498db" : "#00ffff";
            drawRect(this.x, this.y, this.w, this.h, c);
            if(this.type === 'water') drawRect(this.x, this.y + 2, this.w, 4, "#85c1e9");
        }
    }
}

class Particle {
    constructor(x, y, color, type="spark") {
        this.x = x; this.y = y; this.color = color; this.type = type;
        this.life = 1.0;
        if (type === "smoke") {
            this.dx = -2 - Math.random()*2; this.dy = -0.5 - Math.random();
            this.size = 6 + Math.random()*8; this.decay = 0.02;
        } else {
            this.dx = (Math.random() - 0.5) * 14; this.dy = (Math.random() - 0.5) * 14;
            this.size = 4 + Math.random()*5; this.decay = 0.04 + Math.random()*0.03;
        }
    }
    update() { 
        this.x += this.dx; this.y += this.dy; this.life -= this.decay; 
        if(this.type === "smoke") { this.size += 0.2; this.dy -= 0.05; }
    }
    draw() {
        ctx.globalAlpha = Math.max(0, this.life); 
        drawRect(this.x, this.y, this.size, this.size, this.color); 
        ctx.globalAlpha = 1.0;
    }
}

class FloatingText {
    constructor(x, y, text, color) {
        this.x = x; this.y = y; this.text = text; this.color = color; this.life = 1.0; this.dy = -2.5;
    }
    update() { this.y += this.dy; this.life -= 0.02; }
    draw() {
        ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color;
        ctx.font = "16px 'Press Start 2P'"; 
        ctx.shadowColor = "#000"; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 3;
        ctx.fillText(this.text, this.x, this.y); 
        ctx.shadowColor = "transparent"; ctx.globalAlpha = 1.0;
    }
}

/** * BACKGROUND SYSTEM */
class ParallaxBackground {
    draw() {
        let stg = stages[currentStage % 5];
        ctx.fillStyle = stg.bg; ctx.fillRect(0, 0, W, H);
        
        let skyOffset = (distance * 0.5) % 200;
        ctx.fillStyle = stg.sky;
        for(let i = -200; i < W + 200; i += 200) {
            let x = i - skyOffset;
            drawRect(x, GROUND_Y - 150, 60, 150, stg.sky);
            drawRect(x + 70, GROUND_Y - 200, 80, 200, stg.sky);
            drawRect(x + 160, GROUND_Y - 120, 40, 120, stg.sky);
        }

        let midOffset = (distance * 2) % 150;
        ctx.fillStyle = stg.mid;
        for(let i = -150; i < W + 150; i += 150) {
            let x = i - midOffset;
            drawRect(x, GROUND_Y - 50, 40, 50, stg.mid);
            drawRect(x + 60, GROUND_Y - 80, 50, 80, stg.mid);
        }

        drawRect(0, GROUND_Y, W, H - GROUND_Y, stg.ground);
        
        let lineOffset = (distance * 6) % 100;
        ctx.fillStyle = stg.line;
        for(let i = -100; i < W; i+= 100) {
            drawRect(i - lineOffset, GROUND_Y + 30, 50, 8, stg.line);
        }
        
        drawRect(0, GROUND_Y, W, 8, "#555");
    }
}
const bg = new ParallaxBackground();

function spawnParticles(x, y, color, count=10, type="spark") { for(let i=0; i<count; i++) particles.push(new Particle(x, y, color, type)); }
function addScore(pts) { score += pts * player.multiplier; ui.score.innerText = Math.floor(score).toString().padStart(6, '0'); }
function shake(amt) { screenShake = amt; }
function checkCollision(r1, r2) { let p = 6; return !(r2.x > r1.x + r1.w - p || r2.x + r2.w < r1.x + p || r2.y > r1.y + r1.h - p || r2.y + r2.h < r1.y + p); }

/** * MAIN LOOP */
function update() {
    if (gameState === 'MENU' || gameState === 'GAMEOVER') return;
    frameCount++; player.update();
    
    if (gameState === 'PLAYING') {
        distance += (globalSpeed / 60); ui.dist.innerText = Math.floor(distance) + 'm'; addScore(0.1);
        if (frameCount % 60 === 0) {
            let r = Math.random();
            if (r < 0.1) entities.push(new Obstacle('powerup'));
            else if (r < 0.45) entities.push(new Obstacle('air'));
            else entities.push(new Obstacle('ground'));
        }
        if(frameCount % 600 === 0 && globalSpeed < 16) globalSpeed += 0.5;

        if (score >= bossTargetPoints) {
            gameState = 'BOSS'; boss = new Boss();
            ui.bossHp.classList.remove('hidden'); ui.stage.innerText = "WARNING: BOSS!"; ui.stage.style.color = "#fff";
            entities = [];
        }
    }

    if (gameState === 'BOSS') { boss.update(); ui.bossHp.innerText = `BOSS HP: ${boss.hp}`; }

    for (let i = entities.length - 1; i >= 0; i--) {
        let e = entities[i]; e.update();

        for (let j = projectiles.length - 1; j >= 0; j--) {
            let p = projectiles[j];
            if (p.active && checkCollision(p, e)) {
                if (e.type === 'air') {
                    addScore(100); spawnParticles(e.x+10, e.y+10, e.color, 15); sfxExplosion();
                    floatingTexts.push(new FloatingText(e.x, e.y, "+100", "#f1c40f"));
                    entities.splice(i, 1); p.active = false; break;
                } else if (e instanceof GasTank && p.type === 'nail') {
                    spawnParticles(e.x+15, e.y+5, "#fff", 20); sfxExplosion(); shake(6);
                    boss.hp--; boss.hurtFlash = 6; sfxBossHit();
                    entities.splice(i, 1); p.active = false;
                    if (boss.hp <= 0) defeatBoss();
                    break;
                }
            }
        }

        if (e.x + e.w < -50) entities.splice(i, 1);
        else if (checkCollision(player, e)) {
            if (e.type === 'powerup') { activatePowerup(e.powerType); entities.splice(i, 1); sfxPowerup(); }
            else if (player.p_invinc > 0) { spawnParticles(e.x+15, e.y+15, "#fff", 20); sfxExplosion(); shake(4); entities.splice(i, 1); addScore(50); }
            else gameOver();
        } else if (e instanceof GasTank && e.y + e.h >= GROUND_Y && e.type !== 'bouncer') {
            // Explosions matching concept art (Orange/Yellow)
            spawnParticles(e.x+15, e.y+15, "#e67e22", 20); 
            spawnParticles(e.x+15, e.y+15, "#f1c40f", 20); 
            spawnParticles(e.x+15, e.y, "#7f8c8d", 15, "smoke");
            sfxExplosion(); shake(12); entities.splice(i, 1);
            if (e.isIce) { let ice = new Obstacle('ground'); ice.x = e.x; ice.color = "#00ffff"; entities.push(ice); }
        }
    }

    projectiles.forEach(p => p.update()); projectiles = projectiles.filter(p => p.active);
    particles.forEach(p => p.update()); particles = particles.filter(p => p.life > 0);
    floatingTexts.forEach(t => t.update()); floatingTexts = floatingTexts.filter(t => t.life > 0);
    updatePowerupDisplay();
}

function activatePowerup(type) {
    let dur = 600, msg = "";
    switch(type) {
        case 'spread': player.p_spread = dur; msg = "SPREAD!"; break;
        case 'ice': player.p_ice = dur; msg = "ICE HOSE!"; break;
        case 'star': player.p_invinc = dur; msg = "INVINCIBLE!"; break;
        case 'multi': player.p_multi = dur; player.multiplier = 2; msg = "2X SCORE!"; break;
        case 'jump': player.maxJumps = 2; player.p_multi = dur; msg = "DOUBLE JUMP!"; break;
    }
    floatingTexts.push(new FloatingText(player.x, player.y - 30, msg, "#9b59b6"));
}

function updatePowerupDisplay() {
    let st = [];
    if(player.p_invinc > 0) st.push("STAR");
    if(player.p_spread > 0) st.push("SPREAD");
    if(player.p_ice > 0) st.push("ICE");
    if(player.p_multi > 0) st.push("2X");
    if(player.maxJumps > 1) st.push("D-JUMP");
    ui.power.innerText = st.join(" | ");
}

function defeatBoss() {
    gameState = 'TRANSITION'; ui.bossHp.classList.add('hidden');
    spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, "#f1c40f", 80); 
    spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, "#7f8c8d", 40, "smoke"); 
    shake(25); sfxExplosion();
    
    let flyTimer = setInterval(() => {
        boss.y -= 12; boss.x += 6; boss.hurtFlash = 2; draw();
        if (boss.y < -200) {
            clearInterval(flyTimer); currentStage++;
            bossTargetPoints += 1000 + (currentStage * 500); boss = null; globalSpeed += 1;
            ui.stage.innerText = stages[currentStage % 5].name; ui.stage.style.color = "#fff";
            gameState = 'PLAYING';
        }
    }, 16);
}

function draw() {
    bg.draw();
    ctx.save();
    if (screenShake > 0) {
        ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
        screenShake *= 0.85; if (screenShake < 0.5) screenShake = 0;
    }

    if (player) player.draw(); if (boss) boss.draw();
    entities.forEach(e => e.draw()); projectiles.forEach(p => p.draw());
    particles.forEach(p => p.draw()); floatingTexts.forEach(t => t.draw());
    
    if (screenShake > 20) { ctx.fillStyle = "rgba(255,255,255,0.3)"; ctx.fillRect(0,0,W,H); }
    ctx.restore();
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

function startGame(e) {
    if(e) { e.preventDefault(); e.stopPropagation(); }
    initAudio();
    ui.start.classList.add('hidden'); ui.over.classList.add('hidden'); ui.hud.classList.remove('hidden');
    resize(); 
    
    player = new Player(); entities = []; projectiles = []; particles = []; floatingTexts = [];
    score = 0; distance = 0; frameCount = 0; currentStage = 0; globalSpeed = 8;
    bossTargetPoints = 1000; boss = null; gameState = 'PLAYING';
    
    ui.stage.innerText = stages[0].name; ui.stage.style.color = "#fff";
    startSiren();
    if(!renderLoopStarted) { renderLoopStarted = true; requestAnimationFrame(gameLoop); }
}

function gameOver() {
    gameState = 'GAMEOVER'; stopSiren(); shake(25); sfxExplosion();
    spawnParticles(player.x + 40, player.y + 20, "#e74c3c", 80);
    spawnParticles(player.x + 40, player.y + 20, "#333", 40, "smoke");
    if (score > highScore) { highScore = Math.floor(score); localStorage.setItem('ambulanceHighScore', highScore); }
    ui.hud.classList.add('hidden'); ui.over.classList.remove('hidden');
    document.getElementById('finalScore').innerText = Math.floor(score); ui.hiEnd.innerText = highScore;
}

function handleInput(e, isTouch = false) {
    if(gameState !== 'PLAYING' && gameState !== 'BOSS') return;
    let x, y;
    if (isTouch) {
        e.preventDefault(); 
        if(e.changedTouches && e.changedTouches.length > 0) { x = e.changedTouches[0].clientX; y = e.changedTouches[0].clientY; }
        else return;
    } else {
        if (e.code === 'Space') { player.jump(); return; }
        if (e.code === 'KeyF') { player.shoot(false); return; }
        if (e.code === 'KeyG') { player.shoot(true); return; }
        return; 
    }
    if (x < W / 2) player.jump();
    else if (y < H / 2) player.shoot(true); 
    else player.shoot(false); 
}

['click', 'touchstart'].forEach(evt => { ui.startBtn.addEventListener(evt, startGame, {passive: false}); ui.restartBtn.addEventListener(evt, startGame, {passive: false}); });
canvas.addEventListener('touchstart', (e) => handleInput(e, true), {passive: false});
window.addEventListener('keydown', (e) => handleInput(e, false));
window.oncontextmenu = function(e) { e.preventDefault(); e.stopPropagation(); return false; };

draw();
if(!renderLoopStarted) { renderLoopStarted = true; requestAnimationFrame(gameLoop); }

</script>
</body>
</html>
